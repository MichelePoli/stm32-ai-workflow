version: '3.8'

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: stm32-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: stm32-ai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: stm32-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU Support (Comment out if using CPU only)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull-models:
    image: ollama/ollama:latest
    container_name: stm32-ai-ollama-puller
    environment:
      - OLLAMA_HOST=ollama:11434
    volumes:
      - ./scripts/pull_docker_models.sh:/pull_models.sh
    entrypoint: /bin/sh
    command: "-c 'sleep 5; /pull_models.sh'"
    depends_on:
      ollama:
        condition: service_healthy

  # Triton Inference Server
  triton-server:
    build:
      context: .
      dockerfile: Dockerfile.triton
    container_name: stm32-ai-triton
    ports:
      - "8001:8000" # HTTP
      - "8002:8001" # GRPC
      - "8003:8002" # Metrics
    volumes:
      - ./model_repository:/models
    environment:
      - TRITON_MODEL_NAME=TheBloke/Mistral-7B-Instruct-v0.2-GPTQ
      - DEEPSEEK_MODEL_NAME=TheBloke/deepseek-coder-6.7B-instruct-GPTQ
      - GPTOSS_MODEL_NAME=TheBloke/starcoder2-15b-v0.1-GPTQ
      - EMBED_MODEL_NAME=nomic-ai/nomic-embed-text-v1.5
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Triton health endpoint: /v2/health/ready
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 20 # vLLM loading can take minutes
    restart: unless-stopped

  langgraph-app:
    build: .
    container_name: stm32-ai-langgraph
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_TRITON_BACKEND=true
      - TRITON_BASE_URL=http://triton-server:8000/v1
      - LOCAL_LLM=${MODEL_NAME:-mistral}
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      triton-server:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  ollama_data:
