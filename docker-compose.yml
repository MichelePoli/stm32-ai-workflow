  # Triton Inference Server
  triton-server:
    build:
      context: .
      dockerfile: Dockerfile.triton
    container_name: stm32-ai-triton
    ports:
      - "8001:8000" # HTTP
      - "8002:8001" # GRPC
      - "8003:8002" # Metrics
    volumes:
      - ./model_repository:/models
    environment:
      - TRITON_MODEL_NAME=thesven/Mistral-7B-Instruct-v0.3-GPTQ
      - DEEPSEEK_MODEL_NAME=TheBloke/deepseek-coder-6.7B-instruct-GPTQ
      - GPTOSS_MODEL_NAME=TechxGenus/starcoder2-15b-instruct-GPTQ
      - EMBED_MODEL_NAME=nomic-ai/nomic-embed-text-v1.5
    command: ["tritonserver", "--model-repository=/models", "--model-control-mode=explicit", "--log-verbose=1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Triton health endpoint: /v2/health/ready
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 20 # vLLM loading can take minutes
    restart: unless-stopped

  langgraph-app:
    build: .
    container_name: stm32-ai-langgraph
    user: "1002:1002"   # Same UID as host user 'mrusso' for volume permissions
    working_dir: /home/mrusso/stm32-ai-workflow  # Matches host path — critical for absolute paths
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_TRITON_BACKEND=true
      - TRITON_BASE_URL=http://triton-server:8000/v1  # Docker internal network
      - LOCAL_LLM=${MODEL_NAME:-mistral}
      - REDIS_URL=redis://redis:6379
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      # System path first for uvicorn/python, then Miniconda so subprocesses find it
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/mrusso/miniconda3/bin:/home/mrusso/miniconda3/envs/stm32/bin:/home/mrusso/stm32-ai_utilities/linux
      - HOME=/home/mrusso
    ports:
      - "8000:8000"
    depends_on:
#      ollama:
#        condition: service_healthy
      triton-server:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Source code (hot-reload)
      - ./src:/home/mrusso/stm32-ai-workflow/src
      - ./.env:/home/mrusso/stm32-ai-workflow/.env
      # ── Host tools (read-only mounts) ──────────────────────────────────────
      # Miniconda: makes 'stm32' and 'stm32_legacy' envs available in container
      - /home/mrusso/miniconda3:/home/mrusso/miniconda3:ro
      # stedgeai CLI: X-CUBE-AI analysis / code generation tool
      - /home/mrusso/stm32-ai_utilities:/home/mrusso/stm32-ai_utilities:ro
      # ── Persistent data (read-write) ────────────────────────────────────────
      # AI models downloaded from STM32 Model Zoo
      - /home/mrusso/.stm32_ai_models:/home/mrusso/.stm32_ai_models
      # STM32CubeMX project output (generated firmware, datasets)
      - /home/mrusso/stm32-ai-workflow/STM32CubeMX:/home/mrusso/stm32-ai-workflow/STM32CubeMX
      # stedgeai workspace and output
      - /home/mrusso/stm32-ai-workflow/st_ai_ws:/home/mrusso/stm32-ai-workflow/st_ai_ws
      - /home/mrusso/stm32-ai-workflow/st_ai_output:/home/mrusso/stm32-ai-workflow/st_ai_output
      # STM32CubeMX installation (executable + JRE + plugins)
      - /home/mrusso/STM32CubeMX:/home/mrusso/STM32CubeMX:ro
      # STM32Cube firmware packages (downloaded by workflow1)
      - /home/mrusso/STM32Cube:/home/mrusso/STM32Cube:ro
    # GPU access so Keras/TF training subprocesses can use the GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped


volumes:
  redis_data:
#  minio_data:
#  ollama_data:
